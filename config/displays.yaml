# Display manifest — the single source of truth linking every manuscript display to
# the file that backs it and the script that generates it.
#
# Why this file exists
# --------------------
# Repository figure filenames are named for the analysis that produced them
# (aim3_human_compiled.png), while the manuscript names them for where they appear
# (Figure 1). Without a mapping nobody can check that a submitted figure is the one
# the code produced, and a reviewer asking "which script made Figure 1?" has to guess.
#
# `scripts/21_build_submission_displays.py` reads this file to emit journal-named
# copies for submission and to verify that the manifest, the figures on disk and the
# manuscript all agree. If they diverge, that script fails.
#
# label      as it appears in the manuscript; the absence of an "e" prefix is what
#            makes a display count toward the journal's main-display limit
# source     file under reports/figures/
# script     the script that generates it, so any number can be traced to its code
# title      the display title, JAMA style: title case, ending without a full stop

main_figures:
  - label: Figure 1
    source: aim3_human_compiled.png
    script: scripts/13_aim3_human_figures.py
    title: >-
      Aim 3 Primary Endpoint: Reading-Level Reduction Versus Blinded Subspecialist
      Accuracy
  - label: Figure 2
    source: model_comparison_overview.png
    script: scripts/19_model_comparison_figure.py
    title: >-
      Between-Model Differences in Reading Level, Blinded Subspecialist Accuracy, and
      Automated Judge Accuracy

supplementary_figures:
  - label: eFigure 1
    source: aim1_fkgl_by_site.png
    script: scripts/08_generate_figures.py
    title: Flesch-Kincaid Grade Level by Patient-Facing Site (Original Pages, N = 26)
  - label: eFigure 2
