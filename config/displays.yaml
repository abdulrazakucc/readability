    title: Flesch-Kincaid Grade Level by Procedure (Original Pages, N = 26)
  - label: eFigure 3
    source: aim2_fkgl_delta_by_model.png
    script: scripts/08_generate_figures.py
    title: Change in Flesch-Kincaid Grade Level (Rewrite Minus Original) by Model
  - label: eFigure 4
    source: aim3_llm_tradeoff.png
    script: scripts/11_aim3_llm_figures.py
    title: Reading-Level Reduction Versus Automated Consensus Accuracy, by Model
  - label: eFigure 5
    source: aim3_llm_scores_by_model.png
    script: scripts/11_aim3_llm_figures.py
    title: Automated LLM-Judge Consensus Scores by Model
  - label: eFigure 6
    source: aim3_llm_tradeoff_alt.png
    script: scripts/11_aim3_llm_figures.py
    title: The Readability-Accuracy Trade-off Across Models
  - label: eFigure 7
