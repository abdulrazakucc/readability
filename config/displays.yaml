    title: >-
      Blinded Subspecialist Versus Lay Ratings on the Standard Instrument

main_tables:
  - label: Table 1
    script: scripts/07_run_statistics.py
    source_report: reports/aim1_descriptives_overall.csv
    title: Readability of Original Patient Education Pages (N = 26), by Formula
  - label: Table 2
