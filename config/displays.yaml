# Figures generated by the pipeline but not cited in the manuscript. They are kept
# because they support exploratory analyses described in the deviation log, and are
# listed here so the unused set is deliberate rather than accidental clutter.
generated_but_not_submitted:
  - source: aim3_presentation_bias.png
    reason: >-
      Labeled versus neutral presentation within the lay cohort. Reported in the text
      as a descriptive comparison; a display would overstate an analysis confounded
      with reader identity.
  - source: aim3_three_conditions.png
    reason: >-
      All four reviewer cohorts side by side. Superseded for submission by Figure 2,
      which carries the comparison that matters.
